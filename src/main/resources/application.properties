# Node identity. Override per container, for example: -Dorg.thesis.node.id=bank-b
%test.org.thesis.node.id=bank-b
%test.org.thesis.audit.file=target/audit/audit.jsonl

# Resource files
org.thesis.config.ci-profiles=config/ci-profiles.json
org.thesis.config.participants=config/participants.json
org.thesis.config.property-grants=config/property-grants.json
org.thesis.config.scenarios=config/scenarios.json

# Validation controls. These switches are the ablation-test levers.
org.thesis.controls.required-fields.enabled=true
%test.org.thesis.controls.schema-version.enabled=true
org.thesis.controls.digest.enabled=true
%test.org.thesis.controls.raw-identifier.enabled=true
org.thesis.controls.receiver-profile.enabled=true
%test.org.thesis.controls.ci-profile.enabled=true
%test.org.thesis.controls.policy.enabled=true
%test.org.thesis.controls.property-authorisation.enabled=true

# Supported schema versions for this simulation.
org.thesis.schema.supported-versions=fraud-intelligence-event-v1

#Docker related configs to be used by the simulation
quarkus.http.host=0.0.0.0
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}

# Node identity
org.thesis.node.id=${NODE_ID:bank-a}
org.thesis.node.profile-id=${NODE_PROFILE_ID:BANKING_V1}

# Audit output
org.thesis.audit.file=${AUDIT_FILE:/work/audit/audit.jsonl}

# Control toggles for ablation tests
org.thesis.controls.schema-version.enabled=${CONTROL_SCHEMA_VERSION_ENABLED:true}
org.thesis.controls.raw-identifier.enabled=${CONTROL_RAW_IDENTIFIER_ENABLED:true}
org.thesis.controls.ci-profile.enabled=${CONTROL_CI_PROFILE_ENABLED:true}
org.thesis.controls.policy.enabled=${CONTROL_POLICY_ENABLED:true}
org.thesis.controls.property-authorisation.enabled=${CONTROL_PROPERTY_AUTHORISATION_ENABLED:true}